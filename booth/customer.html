<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="bebeknow">
<meta name="theme-color" content="#faf6f1">
<title>bebeknow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap">
<link rel="stylesheet" href="booth.css?v=8">
<style>
  body{padding:24px 24px calc(28px + env(safe-area-inset-bottom))}
  .wrap{max-width:760px;margin:0 auto}
  label.t{font-size:18px}
  input[type=password]{font-size:21px;padding:17px 18px;border-radius:14px}
  .btn{font-size:20px;padding:20px;border-radius:16px}
  .msg{font-size:17px}
  .notice{font-size:15.5px}

  /* 대기 화면 */
  #idle{min-height:calc(100vh - 60px);min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
  #idle .logo{font-size:clamp(56px,11vw,96px);color:var(--accent-deep);line-height:1}
  #idle .slogan{font-size:20px;color:var(--ink-soft)}
  #idle .wait{margin-top:28px;font-size:16px;color:var(--ink-soft)}
  #idle .note{font-size:16px;color:var(--accent-deep);font-weight:700;min-height:1.5em}

  /* 확인 화면 */
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .head .logo{font-size:30px;color:var(--accent-deep)}
  .head h1{font-size:24px;font-weight:800}
  .sum{background:var(--accent-tint);border-radius:16px;padding:16px 18px}
  .sum .it{display:flex;justify-content:space-between;gap:12px;font-size:18px;padding:5px 0}
  .sum .it span:last-child{white-space:nowrap;font-weight:700}
  .sum .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px solid rgba(176,132,100,.35);margin-top:8px;padding-top:10px}
  .sum .tot b{font-size:26px;font-weight:900}
  .sum .meth{font-size:16px;font-weight:700;color:var(--accent-deep);margin-bottom:6px}
  .sum .meth.ship{color:var(--ship)}
  .who{border:1.5px solid var(--line);border-radius:16px;padding:6px 18px;background:#fdfbf8}
  .who .r{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:20px;line-height:1.5}
  .who .r:last-child{border-bottom:none}
  .who .r span{font-size:16px;font-weight:700;color:var(--ink-soft);padding-top:2px}
  .who .r b{font-weight:800}
  .ask{font-size:17px;color:var(--ink-soft);margin:16px 0 12px;text-align:center}
  .btns2{display:flex;gap:10px}
  .btns2 .btn{margin:0}
  .btns2 .btn.sec{flex:.8}
  .btns2 .btn:not(.sec){flex:1.2}
  #privacy{margin-top:14px}
  /* 아이패드 가로: 왼쪽 주문 내역, 오른쪽 고객 정보 + 버튼 */
  @media (min-width: 1000px){
    .wrap{max-width:1080px}
    .fcols{display:grid;grid-template-columns:1fr 1.05fr;gap:26px;align-items:start}
  }
  @media (max-width: 999px){ .fl{margin-bottom:16px} }

  /* 이벤트 추첨 결과 (직원이 맥북에서 뽑으면 대기 중인 아이패드에 크게) */
  #draw{min-height:calc(100vh - 60px);min-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
  #draw .dlbl{font-size:24px;font-weight:800;color:var(--accent-deep)}
  #draw .dnum{font-size:clamp(140px,26vw,240px);font-weight:900;line-height:1;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  #draw .dnum.rolling{color:#c9b5a3}
  #draw .dnum.pop{animation:dpop .5s ease}
  @keyframes dpop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  #draw .dwho{font-size:34px;font-weight:800;min-height:44px}
  #draw .dsub{font-size:17px;color:var(--ink-soft)}

  /* 완료 */
  .done{text-align:center;padding:30px 6px 10px}
  .done .ck{width:96px;height:96px;border-radius:50%;background:var(--ok);color:#fff;font-size:52px;line-height:96px;margin:0 auto 18px}
  .done h1{font-size:30px;font-weight:800;margin-bottom:8px}
  .done .no{font-size:18px;color:var(--ink-soft)}
  .done .ship{font-size:24px;font-weight:800;color:var(--accent-deep);margin:14px 0 2px}
  .done .perk{display:inline-block;margin-top:14px;padding:10px 16px;border-radius:12px;background:var(--ok-tint);color:#3f6b2a;font-size:17px;font-weight:700}
  .done .thanks{margin-top:18px;font-size:17px;color:var(--ink-soft)}
  .done .btn{margin-top:22px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 처음 한 번: 직원이 비밀번호 입력 (이 아이패드는 비밀번호 대신 전용 열쇠만 기억) -->
  <div id="login" hidden style="max-width:440px;margin:14vh auto 0">
    <div class="card">
      <div class="brandf" style="font-size:34px;color:var(--accent-deep);text-align:center;margin-bottom:6px">bebeknow</div>
      <p style="text-align:center;color:var(--ink-soft);margin-bottom:18px">고객 화면 · 직원이 처음 한 번만 설정</p>
      <label class="t" for="pin">비밀번호</label>
      <input type="password" id="pin" inputmode="numeric" maxlength="8" autocomplete="off" style="font-size:28px;letter-spacing:.2em;text-align:center">
      <button class="btn" id="loginBtn" style="margin-top:12px">시작</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <!-- 대기 -->
  <div id="idle" hidden>
    <div class="logo brandf">bebeknow</div>
    <div class="slogan">Easy breath, Easy life</div>
    <div class="note" id="idleNote"></div>
    <div class="wait">직원이 주문을 준비하면 이 화면에 표시됩니다</div>
  </div>

  <!-- 이벤트 추첨 결과 -->
  <div id="draw" hidden>
    <div class="logo brandf" style="font-size:40px;color:var(--accent-deep)">bebeknow</div>
    <div class="dlbl" id="drawLbl">럭키드로우 추첨 중…</div>
    <div class="dnum" id="drawNum">---</div>
    <div class="dwho" id="drawWho"></div>
    <div class="dsub">당첨되신 분은 직원에게 말씀해 주세요</div>
  </div>

  <!-- 주문 확인 (직원이 입력한 내용을 고객이 확인) -->
  <div id="form" hidden>
    <div class="head"><h1>주문 내용을 확인해 주세요</h1><span class="logo brandf">bebeknow</span></div>
    <div class="card fcols">
      <div class="fl">
        <div class="sum" id="sum"></div>
        <p class="notice" id="privacy"></p>
      </div>
      <div class="fr">
        <div class="who" id="who"></div>
        <p class="ask">성함·연락처<span id="askShip">·주소</span>가 맞나요?</p>
        <div class="btns2">
          <button class="btn sec" id="reviseBtn">고칠 부분이 있어요</button>
          <button class="btn" id="submitBtn">맞아요, 주문할게요</button>
        </div>
        <div class="msg" id="formMsg"></div>
      </div>
    </div>
  </div>

  <!-- 완료 -->
  <div id="done" hidden>
    <div class="card done">
      <div class="ck">✓</div>
      <h1>주문이 접수되었습니다</h1>
      <div class="no" id="doneNo"></div>
      <div class="ship" id="doneShip"></div>
      <div id="donePerk"></div>
      <p class="thanks">감사합니다. 고칠 부분이 생기면 직원에게 말씀해 주세요.</p>
      <button class="btn" id="okBtn">확인</button>
    </div>
  </div>

</div>

<script src="common.js?v=8"></script>
<script>
/* 이 아이패드는 직원 비밀번호를 저장하지 않음: 처음에 비밀번호로 "기기 토큰"을 받아 그것만 저장 (지금 진행 중인 주문만 다룰 수 있음) */
var TOKEN_KEY = "bebeknow_booth_token_" + STATION;
var token = "", view = "", cur = null, order = null, skipId = "", pollT = null, idleT = null, shipDate = "";
var busy = false, gen = 0, misses = 0;
var seenDraw = "", drawT = null, rollT = null;   // 마지막으로 보여준 추첨 결과
var drawPhase = "";   // "" | "rolling"(추첨 창 열림, 숫자 도는 중) | "reveal"(당첨 번호 보여주는 중)
var drawOn = false;   // 맥북에서 추첨 창이 열려 있는지
try { localStorage.removeItem("bebeknow_booth_pin_ipad"); } catch (e) {}     // 예전 시험판이 남긴 비밀번호 삭제

function show(id) { view = id; gen++; ["login", "idle", "form", "done", "draw"].forEach(function (k) { $(k).hidden = k !== id; }); window.scrollTo(0, 0); }

/* ---------- 처음 한 번: 직원이 비밀번호 입력 → 기기 토큰 ---------- */
$("loginBtn").addEventListener("click", function () {
  var p = $("pin").value.trim();
  if (!p) return msg($("loginMsg"), "비밀번호를 입력해주세요.");
  $("loginBtn").disabled = true; msg($("loginMsg"), "확인 중…", "info");
  apiPost({ action: "device", pin: p, station: STATION }).then(function (res) {
    $("loginBtn").disabled = false; $("pin").value = "";
    if (res.status === "unauth") return msg($("loginMsg"), "비밀번호가 맞지 않아요.");
    if (res.status === "locked") return msg($("loginMsg"), "비밀번호를 여러 번 틀려 10분간 잠겼어요.");
    if (res.status !== "ok" || !res.token) return msg($("loginMsg"), "연결에 문제가 있어요.");
    msg($("loginMsg"), "");
    token = res.token;
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    begin();
  }).catch(function () { $("loginBtn").disabled = false; msg($("loginMsg"), "네트워크 연결을 확인해주세요."); });
});
$("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") $("loginBtn").click(); });
function needLogin() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} token = ""; clearTimeout(pollT); clearTimeout(idleT); show("login"); }

function getSession() { return apiGet({ cust: "session", token: token, station: STATION }); }
function begin() {
  getSession().then(function (res) {
    if (res.status === "unauth") return needLogin();
    if (res.session && res.session.state === "done") skipId = res.session.id;   // 이미 끝난 주문은 다시 열지 않음
    if (res.draw) seenDraw = res.draw.id;                                       // 켜기 전에 뽑힌 번호는 다시 안 보여줌
    toIdle(""); poll();
  }).catch(function () { toIdle("인터넷 연결을 기다리는 중…"); poll(); });
}

/* ---------- 대기 (화면의 개인정보를 지움) ---------- */
function toIdle(note, keepSkip) {
  clearTimeout(idleT); clearTimeout(drawT); clearInterval(rollT); drawPhase = "";
  if (cur && !keepSkip) skipId = cur.id;
  cur = null; order = null;
  $("who").innerHTML = ""; $("sum").innerHTML = ""; $("doneNo").textContent = "";
  $("idleNote").textContent = note || "";
  show("idle");
}

/* ---------- 직원이 보낸 주문 확인 (1.5초 간격) ---------- */
function poll() {
  clearTimeout(pollT);
  getSession().then(function (res) {
    if (res.status === "unauth") return needLogin();
    if (res.status !== "ok") return;
    if (res.shipDate) shipDate = res.shipDate;
    var s = res.session;
    misses = s ? 0 : misses + 1;
    if (busy) return;                                       // 저장 중에는 화면을 바꾸지 않음
    var fresh = s && s.state === "waiting" && s.id !== skipId && (!cur || s.id !== cur.id);
    if (view === "idle" || view === "done" || view === "draw") {
      if (fresh) return openConfirm(s);                     // 주문 확인 요청이 추첨 표시보다 먼저
      var d = res.draw;
      drawOn = !!(res.drawMode && res.drawMode.on);
      if ((view === "idle" || view === "draw") && d && d.id !== seenDraw) return revealDraw(d);   // 새로 뽑힌 번호 공개
      if (view === "idle" && drawOn) return startRolling(res.drawMode.round);                     // 맥북에서 추첨 창을 열면 숫자 돌리기 시작
      if (view === "draw" && drawPhase === "rolling" && !drawOn) return toIdle("");              // 추첨 창을 닫으면 대기 화면
    } else if (view === "form" && cur) {
      if (s && s.id === cur.id && (s.state === "cancelled" || s.state === "revise")) return toIdle("직원이 내용을 고치고 있어요. 잠시만 기다려 주세요.");
      if (s && s.id === cur.id && s.state === "done" && s.order) { order = s.order; return showDone(); }   // 저장은 됐는데 응답만 끊긴 경우
      if (s && s.id !== cur.id) return fresh ? openConfirm(s) : toIdle("직원이 주문을 바꿨어요. 잠시만 기다려 주세요.");
      if (!s && misses >= 3) toIdle("연결이 끊겼어요. 직원에게 말씀해 주세요.", true);   // 한두 번 비어도 확인 화면은 유지
    }
  }).catch(function () {}).then(function () { if (view !== "login") pollT = setTimeout(poll, 1500); });
}

/* ---------- 이벤트 추첨 ----------
 * 맥북에서 추첨 창을 열면 숫자가 계속 돌고(rolling), 번호가 뽑히면 1초 더 돌다가 공개(reveal).
 * 공개 20초 뒤: 추첨 창이 아직 열려 있으면 다시 돌리고, 닫혔으면 대기 화면 */
function pad3(n) { return ("00" + n).slice(-3); }
function spin() {
  var num = $("drawNum");
  clearInterval(rollT);
  num.classList.remove("pop"); num.classList.add("rolling");
  rollT = setInterval(function () { num.textContent = pad3(1 + Math.floor(Math.random() * 999)); }, 60);
}
function startRolling(round) {
  clearTimeout(drawT);
  drawPhase = "rolling";
  $("drawLbl").textContent = (round ? round + "회차 " : "") + "럭키드로우 추첨 중…";
  $("drawWho").textContent = "";
  if (view !== "draw") show("draw");
  spin();
}
function revealDraw(d) {
  seenDraw = d.id;
  clearTimeout(drawT);
  var wasRolling = view === "draw" && drawPhase === "rolling";
  drawPhase = "reveal";
  if (view !== "draw") show("draw");
  if (!wasRolling) spin();
  $("drawLbl").textContent = d.round + "회차 럭키드로우 추첨 중…";
  $("drawWho").textContent = "";
  drawT = setTimeout(function () {                         // 이미 돌고 있었으면 1초, 아니면 2초 더 돌리고 공개
    clearInterval(rollT);
    var num = $("drawNum");
    num.classList.remove("rolling"); num.textContent = pad3(d.no); void num.offsetWidth; num.classList.add("pop");
    $("drawLbl").textContent = d.round + "회차 " + d.order + "번째 당첨 번호";
    $("drawWho").textContent = d.name ? d.name + "님" : "";
    drawT = setTimeout(function () {
      if (view !== "draw") return;
      if (drawOn) startRolling(d.round); else toIdle("");
    }, 20000);
  }, wasRolling ? 1000 : 2200);
}

/* ---------- 확인 화면 ---------- */
function openConfirm(s) {
  clearTimeout(idleT);
  cur = s; order = null;
  var isShip = s.method === "배송", c = s.customer || {};
  $("sum").innerHTML =
    '<div class="meth' + (isShip ? " ship" : "") + '">' + (isShip ? "🚚 배송 주문" + (shipDate ? " · " + esc(shipDate) + " 발송 예정" : "") : "🛍️ 현장 수령") + "</div>" +
    s.items.map(function (it) {
      var pk = pickupText(it, s.method);
      return '<div class="it"><span>' + (it.color ? '<span class="dot ' + esc(it.color) + '"></span>' : "") + esc(itemLabel(it)) + " × " + esc(it.qty) +
        (pk ? '<br><small style="color:var(--ship);font-weight:700">' + esc(pk) + ' · 택배는 아기비데만</small>' : "") + "</span><span>" + won(it.amount) + "</span></div>";
    }).join("") +
    '<div class="tot"><span>합계</span><b>' + won(s.total) + "</b></div>";
  $("who").innerHTML =
    '<div class="r"><span>성함</span><b>' + esc(c.name) + "</b></div>" +
    '<div class="r"><span>연락처</span><b>' + esc(c.phone) + "</b></div>" +
    (isShip ? '<div class="r"><span>배송지</span><b>' + addrHtml(c) + "</b></div>" +
              (c.request ? '<div class="r"><span>요청사항</span><b>' + esc(c.request) + "</b></div>" : "") : "");
  $("askShip").hidden = !isShip;
  $("privacy").innerHTML = isShip
    ? "성함·연락처·주소는 <b>주문 확인과 상품 배송 목적으로만</b> 사용하며, 배송 완료 후 3개월 뒤 파기합니다."
    : "성함·연락처는 <b>주문 확인과 보증·A/S 안내 목적으로만</b> 사용합니다.";
  msg($("formMsg"), "");
  show("form");
}

function setBusy(b) { busy = b; $("submitBtn").disabled = b; $("reviseBtn").disabled = b; }

$("submitBtn").addEventListener("click", function () {
  if (busy || !cur) return;
  var myGen = gen, btn = $("submitBtn"), label = btn.textContent;
  setBusy(true); btn.innerHTML = '<span class="spin"></span> 접수 중…'; msg($("formMsg"), "");
  apiPost({ action: "order", token: token, station: STATION, sessionId: cur.id }).then(function (res) {
    setBusy(false); btn.textContent = label;
    if (gen !== myGen) return;                              // 그 사이 화면이 바뀜 — 이 응답은 화면에 쓰지 않음
    if (res.status === "unauth") return needLogin();
    if (res.status === "cancelled") return toIdle("직원이 내용을 고치고 있어요. 잠시만 기다려 주세요.");
    if (res.status !== "ok") return msg($("formMsg"), "접수하지 못했어요. 다시 눌러주세요." + (res.message ? " [" + res.message + "]" : ""));
    order = res; showDone();
  }).catch(function () {
    setBusy(false); btn.textContent = label;
    if (gen !== myGen) return;
    msg($("formMsg"), "인터넷 연결이 불안정해요. 다시 눌러주세요. (두 번 눌러도 한 번만 접수됩니다)");
  });
});

$("reviseBtn").addEventListener("click", function () {
  if (busy || !cur) return;
  var myGen = gen;
  setBusy(true); msg($("formMsg"), "직원에게 알리는 중…", "info");
  apiPost({ action: "revise", token: token, station: STATION, id: cur.id }).then(function (res) {
    setBusy(false);
    if (gen !== myGen) return;
    if (res.status === "unauth") return needLogin();
    var s = res.session;
    if (res.status !== "ok") return msg($("formMsg"), "직원에게 알리지 못했어요. 다시 누르거나 직원에게 직접 말씀해 주세요.");
    if (s && s.id === cur.id && s.state === "done" && s.order) { order = s.order; return showDone(); }
    if (s && s.id === cur.id && s.state === "waiting") return msg($("formMsg"), "직원에게 알리지 못했어요. 다시 눌러주세요.");
    toIdle("직원이 고쳐서 다시 보여드릴게요. 고칠 내용을 직원에게 말씀해 주세요.");
  }).catch(function () { setBusy(false); if (gen === myGen) msg($("formMsg"), "직원에게 알리지 못했어요. 직원에게 직접 말씀해 주세요."); });
});

/* ---------- 완료 (15초 뒤 대기 화면) ---------- */
function showDone() {
  var o = order, isShip = o.method === "배송";
  $("doneNo").textContent = "주문번호 " + o.orderNo;
  $("doneShip").textContent = isShip ? (o.shipDate || shipDate) + " 발송 예정" : "직원에게 제품을 받아 가세요";
  var warranty = (o.items || []).some(function (it) { return it.warranty; });
  $("donePerk").innerHTML = warranty ? '<span class="perk">🎁 캐럿헤드 증정 · 🛡️ 보증 기간 1년 → 2년</span>' : "";
  show("done");
  clearTimeout(idleT);
  idleT = setTimeout(function () { if (view === "done") toIdle(""); }, 15000);
}
$("okBtn").addEventListener("click", function () { toIdle(""); });

/* ---------- 시작 ---------- */
(function () {
  try { token = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) {}
  if (!token) return show("login");
  begin();
})();
</script>
