<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>베베노 부스 · 직원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap">
<link rel="stylesheet" href="booth.css?v=1">
<style>
  body{padding:16px 22px 28px}
  .wrap{max-width:1180px;margin:0 auto}
  .top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .top .logo{font-size:26px;color:var(--accent-deep)}
  .top .title{font-size:15px;font-weight:700;color:var(--ink-soft)}
  .tabs{display:flex;gap:6px;margin-left:12px}
  .tabs button{padding:9px 16px;font-size:15px;font-weight:700;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft)}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .top .sp{flex:1}
  .top .st{font-size:13px;color:var(--ink-soft)}
  .top .out{padding:8px 14px;font-size:13px;border-radius:999px;border:1.5px solid var(--line);background:none;color:var(--ink-soft)}

  /* 접수 */
  .grid{display:grid;grid-template-columns:1fr 1.08fr;gap:16px;align-items:start}
  .card h2{font-size:17px;font-weight:800;margin-bottom:14px;color:var(--accent-deep)}
  .prods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .prod{border:1.5px solid var(--line);border-radius:16px;background:#fdfbf8;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:96px}
  button.prod:hover{border-color:var(--accent)}
  button.prod:active{transform:scale(.98)}
  .prod b{font-size:18px}
  .prod small{font-size:14px;color:var(--ink-soft)}
  .prod.wide{grid-column:1 / -1}
  .colors{display:flex;gap:8px;margin-top:8px}
  .colors button{flex:1;padding:12px 6px;font-size:16px;font-weight:800;color:#fff;border:none;border-radius:12px}
  .colors button:active{transform:scale(.97)}
  .colors .핑크{background:var(--pink)}.colors .베이지{background:var(--beige)}.colors .그린{background:var(--green)}
  .hint{font-size:13px;color:var(--ink-soft);margin-top:12px;line-height:1.5}

  .cart{min-height:120px}
  .empty{padding:30px 10px;text-align:center;color:var(--ink-soft);font-size:15px;border:1.5px dashed var(--line);border-radius:14px}
  .line{display:grid;grid-template-columns:1fr auto 132px 34px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .line .nm{font-size:16px;font-weight:700}
  .qty{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .qty button{width:38px;height:40px;border:none;background:#fdfbf8;font-size:20px;font-weight:700}
  .qty b{min-width:34px;text-align:center;font-size:17px}
  .line input.amt{padding:9px 10px;font-size:16px;text-align:right;border-radius:10px}
  .line .x{width:34px;height:34px;border-radius:50%;border:none;background:var(--bg);color:var(--ink-soft);font-size:15px}
  .locked .qty button,.locked .x{visibility:hidden}
  .locked input.amt{pointer-events:none;background:#fff;border-color:transparent}
  .total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 2px 4px}
  .total span{font-size:15px;font-weight:700;color:var(--ink-soft)}
  .total strong{font-size:28px;font-weight:900}
  .method{margin:12px 0 4px}

  .status{margin-top:12px;padding:18px;border-radius:16px;background:var(--accent-tint);text-align:center}
  .status .big{font-size:20px;font-weight:800;margin-bottom:6px}
  .status p{font-size:15px;color:var(--ink-soft);line-height:1.6}
  .status.done{background:var(--ok-tint)}
  .status .who{margin-top:10px;font-size:15px;line-height:1.7;color:var(--ink);text-align:left;background:#fff;border-radius:12px;padding:12px 14px}
  .status .btns{display:flex;gap:8px;margin-top:12px}
  .status .btns .btn{margin:0}

  /* 주문 찾기 */
  .find{max-width:860px}
  .find .bar{display:flex;gap:8px}
  .find .bar .btn{width:auto;padding:0 26px}
  .order{border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:16px;margin-top:12px}
  .order .h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
  .order .h b{font-size:18px}
  .order .h .no{font-size:14px;color:var(--ink-soft)}
  .badge{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--accent-tint);color:var(--accent-deep)}
  .badge.ship{background:#e3edf7;color:var(--ship)}
  .badge.done{background:#eceae7;color:var(--ink-soft)}
  .order .info{font-size:15px;line-height:1.7;margin-top:6px}
  .order .items{font-size:14px;color:var(--ink-soft);margin-top:4px;line-height:1.6}
  .order .acts{display:flex;gap:8px;margin-top:12px}
  .order .acts .btn{width:auto;padding:10px 20px;font-size:15px}
  .edit{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
</style>
</head>
<body>
<div class="wrap">

  <!-- 로그인 -->
  <div id="login" style="max-width:420px;margin:12vh auto 0">
    <div class="top"><span class="logo brandf">bebeknow</span><span class="title">부스 직원 화면</span></div>
    <div class="card">
      <label class="t" for="pin">비밀번호 <small>(시트 "집계" 탭 B2)</small></label>
      <input type="password" id="pin" inputmode="numeric" maxlength="8" autocomplete="off" style="font-size:26px;letter-spacing:.2em;text-align:center">
      <button class="btn" id="loginBtn" style="margin-top:10px">들어가기</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <div id="app" hidden>
    <div class="top">
      <span class="logo brandf">bebeknow</span>
      <span class="title">부스 직원</span>
      <div class="tabs"><button id="tabTake" class="on">접수</button><button id="tabFind">주문 찾기 · 수정</button></div>
      <span class="sp"></span>
      <span class="st" id="stationLbl"></span>
      <button class="out" id="logoutBtn">나가기</button>
    </div>

    <!-- ===== 접수 ===== -->
    <div id="viewTake" class="grid">
      <div class="card">
        <h2>제품 담기</h2>
        <div class="prods" id="prods"></div>
        <p class="hint">누를 때마다 1개씩 담깁니다. 같은 제품을 다시 누르면 수량이 늘어나요.</p>
      </div>

      <div class="card">
        <h2>주문 내역</h2>
        <div class="cart" id="cart"></div>
        <div class="total"><span>합계</span><strong id="total">0원</strong></div>
        <div id="sendBox">
          <div class="chips method">
            <label class="chip"><input type="radio" name="method" value="현장" checked><span>🛍️ 현장 수령</span></label>
            <label class="chip ship"><input type="radio" name="method" value="배송"><span>🚚 배송</span></label>
          </div>
          <button class="btn" id="sendBtn" style="margin-top:12px">아이패드로 보내기</button>
          <div class="msg" id="takeMsg"></div>
        </div>
        <div id="statusBox" class="status" hidden></div>
      </div>
    </div>

    <!-- ===== 주문 찾기 · 수정 ===== -->
    <div id="viewFind" class="find" hidden>
      <div class="card">
        <div class="bar">
          <input type="search" id="q" placeholder="고객 성함 또는 연락처 뒷자리" autocomplete="off">
          <button class="btn" id="findBtn">찾기</button>
        </div>
        <div class="msg" id="findMsg"></div>
      </div>
      <div id="results"></div>
    </div>

    <footer>bebeknow booth · <span id="ver">v2026.10.14-1</span></footer>
  </div>
</div>

<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="common.js?v=1"></script>
<script src="po.js?v=1"></script>
<script>
/* 비밀번호는 로그인 때 한 번만 쓰고, 이후에는 직원용 토큰(1일)으로 요청 — 비밀번호 잠금이 걸려도 이미 로그인한 화면은 동작 */
var TOKEN_KEY = "bebeknow_booth_staff_token", ACK_KEY = "bebeknow_booth_ack";
var tok = "";
try { sessionStorage.removeItem("bebeknow_booth_pin"); } catch (e) {}
var cart = [];            // {product, color, qty, amount, manual}
var phase = "edit";       // edit → sending → waiting(아이패드 입력 중) → done(접수 완료)
var sessId = "", order = null, lastRev = 0, pollT = null, shipDate = "";
var lastSend = null;      // {id, sig}: 보내기가 응답 없이 끝났을 때 같은 내용이면 같은 번호로 다시 보냄(중복 주문 방지)
var editing = 0;          // 직원이 주문을 고치는 중이면 상태 확인이 그 변경을 "고객 수정"으로 오인하지 않게
function cartSig() { return JSON.stringify([radio("method"), cart.map(function (l) { return [l.product, l.color, l.qty, l.amount]; })]); }

function radio(name) { var r = document.querySelector('input[name="' + name + '"]:checked'); return r ? r.value : ""; }

/* ---------- 로그인 ---------- */
function enter(t) {
  tok = t;
  try { sessionStorage.setItem(TOKEN_KEY, t); } catch (e) {}
  $("login").hidden = true; $("app").hidden = false;
  $("stationLbl").textContent = "스테이션 " + STATION;
  renderProducts(); renderCart();
}
/* 새로고침해도 진행 중이던 주문을 이어감 (입력 중이면 계속 기다리고, 끝난 주문은 인쇄 없이 보여줌) */
function restore(s) {
  if (!s) return;
  var ack = ""; try { ack = sessionStorage.getItem(ACK_KEY) || ""; } catch (e) {}
  if (s.id === ack || (s.state !== "waiting" && s.state !== "done")) return;
  cart = s.items.map(function (it) { return { product: it.product, color: it.color, qty: it.qty, amount: it.amount, manual: it.amount !== priceOf(it.product) * it.qty }; });
  var m = document.querySelector('input[name="method"][value="' + s.method + '"]'); if (m) m.checked = true;
  sessId = s.id; lastSend = { id: s.id, sig: cartSig() };
  if (s.state === "waiting") { setPhase("waiting"); poll(); return; }
  order = s.order; lastRev = s.rev || 1; setPhase("done");
  renderStatus("새로고침 전에 접수된 주문이에요. 필요하면 다시 인쇄하세요."); poll();
}
function lockedMsg(el) { msg(el, "비밀번호를 여러 번 틀려 10분간 잠겼어요. 잠시 후 다시 시도해주세요."); }
function logout() { try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} location.reload(); }
/* 토큰으로 현재 세션을 받아 화면에 들어감 */
function openWith(t) {
  return apiGet({ staff: "session", token: t, station: STATION }).then(function (res) {
    if (res.status !== "ok") return res;
    shipDate = res.shipDate || ""; enter(t); restore(res.session);
    return res;
  });
}
$("loginBtn").addEventListener("click", function () {
  var p = $("pin").value.trim();
  if (!p) return msg($("loginMsg"), "비밀번호를 입력해주세요.");
  $("loginBtn").disabled = true; msg($("loginMsg"), "확인 중…", "info");
  apiPost({ action: "device", role: "staff", pin: p, station: STATION }).then(function (res) {
    if (res.status === "unauth") throw { m: "비밀번호가 맞지 않아요." };
    if (res.status === "locked") throw { m: "비밀번호를 여러 번 틀려 10분간 잠겼어요. 잠시 후 다시 시도해주세요." };
    if (res.status !== "ok" || !res.token) throw { m: "연결에 문제가 있어요. 잠시 후 다시 시도해주세요." };
    $("pin").value = "";
    return openWith(res.token);
  }).then(function (res) {
    $("loginBtn").disabled = false;
    if (res.status !== "ok") msg($("loginMsg"), "연결에 문제가 있어요. 잠시 후 다시 시도해주세요."); else msg($("loginMsg"), "");
  }).catch(function (e) { $("loginBtn").disabled = false; msg($("loginMsg"), (e && e.m) || "네트워크 연결을 확인해주세요."); });
});
$("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") $("loginBtn").click(); });
$("logoutBtn").addEventListener("click", function () {
  if (phase === "waiting" && !confirm("아이패드에서 고객이 입력 중입니다. 나갈까요?")) return;
  logout();
});

/* ---------- 탭 ---------- */
function setTab(t) {
  $("tabTake").classList.toggle("on", t === "take"); $("tabFind").classList.toggle("on", t === "find");
  $("viewTake").hidden = t !== "take"; $("viewFind").hidden = t !== "find";
  if (t === "find") $("q").focus();
}
$("tabTake").addEventListener("click", function () { setTab("take"); });
$("tabFind").addEventListener("click", function () { setTab("find"); });

/* ---------- 제품 담기 ---------- */
function renderProducts() {
  $("prods").innerHTML = PRODUCTS.map(function (p) {
    if (p.color) {
      return '<div class="prod wide"><b>' + esc(p.key) + "</b><small>" + won(p.price) + " · 색상을 눌러 담기</small>" +
        '<div class="colors">' + COLORS.map(function (c) {
          return '<button type="button" class="' + c + '" data-p="' + esc(p.key) + '" data-c="' + c + '">' + c + "</button>";
        }).join("") + "</div></div>";
    }
    return '<button type="button" class="prod" data-p="' + esc(p.key) + '"><b>' + esc(p.key) + "</b><small>" + won(p.price) + "</small></button>";
  }).join("");
}
$("prods").addEventListener("click", function (e) {
  var b = e.target.closest("[data-p]"); if (!b) return;
  if (phase !== "edit") return msg($("takeMsg"), "지금 주문이 진행 중이에요. 끝난 뒤 다음 고객으로 넘어가 주세요.", "info");
  addItem(b.dataset.p, b.dataset.c || "");
});
function addItem(product, color) {
  var line = cart.filter(function (l) { return l.product === product && l.color === color; })[0];
  if (line) { line.qty = Math.min(99, line.qty + 1); if (!line.manual) line.amount = priceOf(product) * line.qty; }
  else cart.push({ product: product, color: color, qty: 1, amount: priceOf(product), manual: false });
  msg($("takeMsg"), ""); renderCart();
}

/* ---------- 주문 내역 ---------- */
function cartTotal() { return cart.reduce(function (s, l) { return s + (Number(l.amount) || 0); }, 0); }
function renderCart() {
  var box = $("cart");
  box.classList.toggle("locked", phase !== "edit");
  if (!cart.length) box.innerHTML = '<div class="empty">왼쪽에서 제품을 누르면 여기에 담깁니다.</div>';
  else box.innerHTML = cart.map(function (l, i) {
    return '<div class="line" data-i="' + i + '">' +
      '<div class="nm">' + (l.color ? '<span class="dot ' + l.color + '"></span>' : "") + esc(itemLabel(l)) + "</div>" +
      '<div class="qty"><button type="button" data-a="minus" aria-label="수량 줄이기">−</button><b>' + l.qty + '</b><button type="button" data-a="plus" aria-label="수량 늘리기">+</button></div>' +
      '<input type="text" class="amt" inputmode="numeric" value="' + Number(l.amount).toLocaleString("ko-KR") + '" aria-label="금액">' +
      '<button type="button" class="x" data-a="del" aria-label="빼기">✕</button></div>';
  }).join("");
  $("total").textContent = won(cartTotal());
}
$("cart").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-a]"); if (!b || phase !== "edit") return;
  var i = +b.closest(".line").dataset.i, l = cart[i];
  if (b.dataset.a === "del") cart.splice(i, 1);
  else {
    l.qty = Math.max(1, Math.min(99, l.qty + (b.dataset.a === "plus" ? 1 : -1)));
    if (!l.manual) l.amount = priceOf(l.product) * l.qty;
  }
  renderCart();
});
/* 금액을 직접 고치면 그 줄은 자동 계산을 멈춤 */
$("cart").addEventListener("input", function (e) {
  if (!e.target.classList.contains("amt")) return;
  var i = +e.target.closest(".line").dataset.i, d = digits(e.target.value);
  cart[i].amount = Number(d) || 0; cart[i].manual = true;
  e.target.value = d ? Number(d).toLocaleString("ko-KR") : "";
  $("total").textContent = won(cartTotal());
});

/* ---------- 아이패드로 보내기 ---------- */
$("sendBtn").addEventListener("click", function () {
  msg($("takeMsg"), "");
  if (!cart.length) return msg($("takeMsg"), "제품을 먼저 담아주세요.");
  var sig = cartSig();
  var id = lastSend && lastSend.sig === sig ? lastSend.id : uid();      // 같은 내용으로 다시 누르면 같은 번호
  lastSend = { id: id, sig: sig };
  var btn = $("sendBtn");
  btn.textContent = "보내는 중…"; setPhase("sending");
  var ack = ""; try { ack = sessionStorage.getItem(ACK_KEY) || ""; } catch (e) {}
  apiPost({ action: "push", token: tok, station: STATION, id: id, ack: ack, method: radio("method"),
            items: cart.map(function (l) { return { product: l.product, color: l.color, qty: l.qty, amount: l.amount }; }) })
    .then(function (res) {
      if (res.status === "conflict" && res.session && res.session.order) {   // 응답이 끊긴 사이 고객이 접수를 끝낸 주문이 있음 → 그 주문부터 처리
        btn.textContent = "아이패드로 보내기";
        var s0 = res.session; sessId = s0.id; order = s0.order; lastRev = s0.rev || 1; lastSend = null;
        cart = s0.items.map(function (it) { return { product: it.product, color: it.color, qty: it.qty, amount: it.amount, manual: true }; });
        var m0 = document.querySelector('input[name="method"][value="' + s0.method + '"]'); if (m0) m0.checked = true;
        setPhase("done");
        renderStatus("⚠ 연결이 끊긴 사이 아이패드에서 접수된 주문이에요. 아직 출력되지 않았을 수 있으니 [다시 인쇄]로 확인한 뒤 다음 고객을 눌러주세요.");
        poll(); return;
      }
      btn.textContent = "아이패드로 보내기";
      if (res.status === "unauth") return logout();
      if (res.status === "locked") { setPhase("edit"); return lockedMsg($("takeMsg")); }
      if (res.status !== "ok") { lastSend = null; setPhase("edit"); return msg($("takeMsg"), "보내지 못했어요." + (res.message ? " [" + res.message + "]" : "")); }
      sessId = id; order = null; lastRev = 0;
      var s = res.session;
      if (s && s.state === "done") { order = s.order; lastRev = s.rev; setPhase("done"); printPO(order); }   // 응답이 늦는 사이 고객이 이미 끝낸 경우
      else setPhase("waiting");
      poll();
    }).catch(function () {
      btn.textContent = "아이패드로 보내기"; setPhase("edit");
      msg($("takeMsg"), "응답이 없어요. 인터넷을 확인하고 다시 눌러주세요. (같은 주문은 한 번만 보내집니다)");
    });
});

function setPhase(p) {
  phase = p;
  $("sendBox").hidden = p !== "edit" && p !== "sending";
  $("sendBtn").disabled = p === "sending";
  Array.prototype.forEach.call(document.querySelectorAll('input[name="method"]'), function (r) { r.disabled = p !== "edit"; });
  renderCart(); renderStatus();
}
function renderStatus(note) {
  var box = $("statusBox");
  if (phase === "edit" || phase === "sending") { box.hidden = true; return; }
  box.hidden = false;
  if (phase === "waiting") {
    box.className = "status";
    box.innerHTML = '<div class="big"><span class="spin"></span> 아이패드에서 고객이 입력 중</div>' +
      "<p>" + (radio("method") === "배송" ? "🚚 배송" : "🛍️ 현장 수령") + " · 성함·연락처" + (radio("method") === "배송" ? "·주소" : "") + "를 적고 있어요.</p>" +
      '<div class="btns"><button class="btn danger" id="cancelBtn">보내기 취소하고 고치기</button></div>';
    $("cancelBtn").addEventListener("click", cancelSend);
    return;
  }
  var o = order;
  box.className = "status done";
  box.innerHTML = '<div class="big">✓ 접수 완료 · ' + esc(o.orderNo) + "</div>" +
    "<p>" + (note || "Purchase Order를 출력했어요.") + "</p>" +
    '<div class="who"><b>' + esc(o.name) + "</b> · " + esc(o.phone) +
      (o.method === "배송" ? "<br>" + esc((o.zip ? "(" + o.zip + ") " : "") + o.address + " " + (o.address2 || "")) + (o.request ? "<br>요청: " + esc(o.request) : "") + "<br>📦 " + esc(o.shipDate || shipDate) + " 발송 예정" : "<br>🛍️ 현장 수령") +
      (o.participant ? "<br>🎁 이벤트 참여자" + (o.items.some(function (it) { return it.warranty; }) ? " · 캐럿헤드 증정 · 보증 1년 연장" : "") : "") +
      (o.shipLogged === false && o.method === "배송" ? '<br><span style="color:var(--err)">⚠ 토글업로드 탭 기록 실패 — 시트에서 직접 확인</span>' : "") +
    "</div>" +
    '<div class="btns"><button class="btn sec" id="reprintBtn">다시 인쇄</button><button class="btn" id="nextBtn">다음 고객</button></div>';
  $("reprintBtn").addEventListener("click", function () { printPO(order); });
  $("nextBtn").addEventListener("click", nextCustomer);
}
function cancelSend() {
  var b = $("cancelBtn"); b.disabled = true;
  function fail(t) { if ($("cancelBtn")) $("cancelBtn").disabled = false; var p = $("statusBox").querySelector("p"); if (p) p.textContent = t; }
  apiPost({ action: "cancel", token: tok, station: STATION, id: sessId }).then(function (res) {
    if (phase !== "waiting") return;                         // 그 사이 상태 확인이 이미 완료로 넘김(인쇄도 이미 함)
    if (res.status === "unauth") return logout();
    if (res.status !== "ok") return fail("취소하지 못했어요. 다시 눌러주세요.");
    var s = res.session;
    if (s && s.id === sessId && s.state === "done") { order = s.order; lastRev = s.rev; setPhase("done"); printPO(order); return; }   // 그 사이 고객이 끝낸 경우
    if (s && s.id === sessId && s.state === "waiting") return fail("취소하지 못했어요. 다시 눌러주세요.");
    sessId = ""; lastSend = null; setPhase("edit"); msg($("takeMsg"), "보내기를 취소했어요. 고친 뒤 다시 보내주세요.", "info");
  }).catch(function () { fail("취소하지 못했어요. 인터넷을 확인하고 다시 눌러주세요."); });
}
function nextCustomer() {
  clearTimeout(pollT);
  try { sessionStorage.setItem(ACK_KEY, sessId); } catch (e) {}
  cart = []; sessId = ""; order = null; lastRev = 0; lastSend = null;
  document.querySelector('input[name="method"][value="현장"]').checked = true;
  msg($("takeMsg"), ""); setPhase("edit");
}

/* ---------- 아이패드 상태 확인 (입력 중 1.5초, 완료 뒤 3초 간격) ---------- */
function poll() {
  clearTimeout(pollT);
  if (phase === "edit" || phase === "sending" || !sessId) return;
  var mine = sessId;
  apiGet({ staff: "session", token: tok, station: STATION }).then(function (res) {
    if (res.status === "unauth") return logout();
    var s = res.session;
    if (res.status !== "ok" || mine !== sessId || !s || s.id !== sessId) return;
    if (s.state === "done") {
      if (phase === "waiting") { order = s.order; lastRev = s.rev; setPhase("done"); printPO(order); }
      else if (!editing && s.rev > lastRev) {             // 고객이 아이패드에서 정보를 고침 → 다시 출력
        order = s.order; lastRev = s.rev; renderStatus("고객이 정보를 고쳤어요. 고친 내용으로 다시 출력했어요."); printPO(order);
      }
    } else if (s.state === "cancelled" && phase === "waiting") { sessId = ""; lastSend = null; setPhase("edit"); msg($("takeMsg"), "보내기가 취소됐어요. 다시 보내주세요.", "info"); }
  }).catch(function () {}).then(function () {
    if (phase !== "edit" && mine === sessId) pollT = setTimeout(poll, phase === "waiting" ? 1500 : 3000);
  });
}

/* ---------- 주문 찾기 · 수정 ---------- */
var found = [];
$("findBtn").addEventListener("click", find);
$("q").addEventListener("keydown", function (e) { if (e.key === "Enter") find(); });
function find() {
  var q = $("q").value.trim();
  if (!q) return msg($("findMsg"), "성함이나 연락처 뒷자리를 입력해주세요.");
  msg($("findMsg"), "찾는 중…", "info"); $("findBtn").disabled = true;
  apiGet({ staff: "orders", token: tok, q: q }).then(function (res) {
    $("findBtn").disabled = false;
    if (res.status === "unauth") return logout();
    if (res.status === "locked") return lockedMsg($("findMsg"));
    if (res.status !== "ok") return msg($("findMsg"), "찾지 못했어요. 잠시 후 다시 시도해주세요.");
    found = res.orders || [];
    msg($("findMsg"), found.length ? "" : "맞는 주문이 없어요. 부스 화면(새 방식)으로 받은 주문만 찾을 수 있어요.", "info");
    renderResults();
  }).catch(function () { $("findBtn").disabled = false; msg($("findMsg"), "네트워크 연결을 확인해주세요."); });
}
function orderCard(o, i) {
  var isShip = o.method === "배송";
  return '<div class="order" data-i="' + i + '">' +
    '<div class="h"><b>' + esc(o.name) + '</b><span class="no">' + esc(o.orderNo) + " · " + esc(o.at) + "</span>" +
      '<span class="badge' + (isShip ? " ship" : "") + '">' + (isShip ? "배송" : "현장 수령") + "</span>" +
      (o.shipped ? '<span class="badge done">발송 완료</span>' : "") + "</div>" +
    '<div class="info">' + esc(o.phone) + (isShip ? "<br>" + esc((o.zip ? "(" + o.zip + ") " : "") + o.address + " " + (o.address2 || "")) + (o.request ? "<br>요청: " + esc(o.request) : "") : "") + "</div>" +
    '<div class="items">' + o.items.map(function (it) { return esc(itemLabel(it)) + " × " + it.qty + " · " + won(it.amount); }).join("<br>") + "<br><b>합계 " + won(o.total) + "</b></div>" +
    '<div class="acts">' + (o.shipped ? "" : '<button class="btn sec" data-a="edit">정보 수정</button>') + '<button class="btn ghost" data-a="print">인쇄</button></div>' +
    '<div class="edit" hidden></div><div class="msg"></div></div>';
}
function renderResults() { $("results").innerHTML = found.map(orderCard).join(""); }
$("results").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-a]"); if (!b) return;
  var card = b.closest(".order"), i = +card.dataset.i, o = found[i];
  if (b.dataset.a === "print") return printPO(o);
  if (b.dataset.a === "edit") return openEdit(card, o);
  if (b.dataset.a === "addr") {
    var ok = openAddrSearch(function (r) { card.querySelector('[name="zip"]').value = r.zip; card.querySelector('[name="address"]').value = r.address; card.querySelector('[name="address2"]').focus(); });
    if (!ok) msg(card.querySelector(".msg"), "주소 검색을 불러오지 못했어요. 직접 입력해주세요.");
    return;
  }
  if (b.dataset.a === "cancelEdit") { card.querySelector(".edit").hidden = true; return; }
  if (b.dataset.a === "save") return saveEdit(card, i);
});
function openEdit(card, o) {
  var box = card.querySelector(".edit"), isShip = o.method === "배송";
  box.innerHTML =
    '<div class="row"><div class="field"><label class="t">성함</label><input type="text" name="name" value="' + esc(o.name) + '"></div>' +
    '<div class="field"><label class="t">연락처</label><input type="tel" name="phone" inputmode="numeric" value="' + esc(o.phone) + '"></div></div>' +
    (isShip ?
      '<div class="field"><label class="t">배송 주소</label><div class="addr-row"><input type="text" name="zip" placeholder="우편번호" value="' + esc(o.zip) + '"><button type="button" class="addr-btn" data-a="addr">🔍 주소 검색</button></div>' +
      '<input type="text" name="address" placeholder="주소" value="' + esc(o.address) + '" style="margin-top:8px">' +
      '<input type="text" name="address2" placeholder="상세주소" value="' + esc(o.address2) + '" style="margin-top:8px"></div>' +
      '<div class="field"><label class="t">배송 요청사항</label><input type="text" name="request" value="' + esc(o.request) + '"></div>' : "") +
    '<div class="row"><button class="btn ghost" data-a="cancelEdit">닫기</button><button class="btn" data-a="save">저장하고 다시 인쇄</button></div>';
  box.hidden = false;
  box.querySelector('[name="phone"]').addEventListener("input", function () { this.value = fmtPhone(this.value); });
  box.querySelector('[name="name"]').focus();
}
function saveEdit(card, i) {
  var o = found[i], box = card.querySelector(".edit"), m = card.querySelector(".msg"), b = box.querySelector('[data-a="save"]');
  function v(n) { var el = box.querySelector('[name="' + n + '"]'); return el ? el.value.trim() : ""; }
  if (!v("name")) return msg(m, "성함을 입력해주세요.");
  if (digits(v("phone")).length < 10) return msg(m, "연락처를 확인해주세요.");
  if (o.method === "배송" && !v("address")) return msg(m, "배송 주소를 입력해주세요.");
  b.disabled = true; b.textContent = "저장 중…";
  var mineOrder = order && order.orderNo === o.orderNo;
  if (mineOrder) editing++;
  function done() { if (mineOrder) setTimeout(function () { editing = Math.max(0, editing - 1); }, 4000); }   // 늦게 도착하는 상태 확인 응답까지 무시
  apiPost({ action: "update", token: tok, station: STATION, orderNo: o.orderNo, name: v("name"), phone: v("phone"),
            zip: v("zip"), address: v("address"), address2: v("address2"), request: v("request") })
    .then(function (res) {
      done();
      b.disabled = false; b.textContent = "저장하고 다시 인쇄";
      if (res.status === "unauth") return logout();
      if (res.status === "locked") return lockedMsg(m);
      if (res.status === "shipped") return msg(m, "이미 발송 완료로 체크된 주문이라 고칠 수 없어요. 시트에서 확인해주세요.");
      if (res.status !== "ok") return msg(m, "저장하지 못했어요." + (res.message ? " [" + res.message + "]" : ""));
      found[i] = res.order;
      if (order && order.orderNo === res.order.orderNo) {       // 방금 접수한 주문을 고친 경우: 상태 확인이 또 인쇄하지 않게
        order = res.order; if (res.rev != null) lastRev = Math.max(lastRev, res.rev); if (phase === "done") renderStatus("직원이 정보를 고쳤어요.");
      }
      renderResults();
      var nc = $("results").querySelector('.order[data-i="' + i + '"]');
      msg(nc.querySelector(".msg"), "저장했어요. 고친 내용으로 다시 출력합니다.", "ok");
      printPO(res.order);
    }).catch(function () { done(); b.disabled = false; b.textContent = "저장하고 다시 인쇄"; msg(m, "네트워크 연결을 확인해주세요."); });
}

/* ---------- 자동 로그인 ---------- */
(function () {
  var saved = ""; try { saved = sessionStorage.getItem(TOKEN_KEY) || ""; } catch (e) {}
  if (!saved) return;
  openWith(saved).then(function (res) { if (res.status !== "ok") { try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} } }).catch(function () {});
})();
</script>
</body>
</html>
