<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>이벤트 QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap">
<style>
  :root{--bg:#f8f4ef;--card:#fff;--ink:#3a2f28;--ink-soft:#8a7e75;--line:#ece4dc;--accent:#c9a086;--accent-deep:#b08464}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(120,90,60,.08)}
  .logo{font-family:"Comfortaa",sans-serif;font-weight:700;letter-spacing:-.045em;font-size:30px;color:var(--accent-deep)}
  h1{font-size:18px;font-weight:800;margin:6px 0 18px}
  .qr{width:100%;max-width:300px;aspect-ratio:1;display:block;margin:0 auto;border-radius:12px;border:1px solid var(--line)}
  .url{margin:14px 0 20px;font-size:14px;color:var(--ink-soft);word-break:break-all}
  .url a{color:var(--accent-deep)}
  .btn{display:block;width:100%;padding:15px;border-radius:14px;font-size:17px;font-weight:800;text-decoration:none;margin-top:10px;background:var(--accent-deep);color:#fff}
  .btn.sec{background:#fff;color:var(--accent-deep);border:1.5px solid var(--accent)}
  .btn small{display:block;font-size:12.5px;font-weight:600;opacity:.85;margin-top:3px}
  .note{margin-top:18px;font-size:12.5px;line-height:1.6;color:var(--ink-soft);text-align:left}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">bebeknow</div>
    <h1>부스 이벤트 페이지 QR</h1>
    <img class="qr" src="bebeknow_event_qr.png" alt="베베노 이벤트 페이지 QR 코드">
    <div class="url"><a href="https://bebeknow.github.io/event/">https://bebeknow.github.io/event/</a></div>
    <a class="btn" href="bebeknow_event_qr.png" download="베베노_이벤트_QR.png">PNG 다운로드<small>2000 × 2000px · 배너·포스터·POP</small></a>
    <a class="btn sec" href="bebeknow_event_qr.svg" download="베베노_이벤트_QR.svg">SVG 다운로드<small>벡터 · 큰 현수막 인쇄용</small></a>
    <p class="note">· 테두리 흰 여백은 자르지 마세요.<br>· 테이블용은 한 변 3cm 이상으로 인쇄해 주세요.<br>· 이벤트 페이지 내용이 바뀌어도 QR은 그대로 써도 됩니다.</p>
  </div>
</body>
</html>
