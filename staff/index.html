<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="4;url=../booth/">
<title>베베노 스태프 · 부스 화면으로 이동</title>
<style>
  :root{--bg:#faf6f1;--card:#fff;--ink:#4a3f36;--ink-soft:#8a7c70;--line:#e9dfd5;--accent:#c9a086;--accent-deep:#b08464}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 24px;max-width:440px;width:100%;text-align:center}
  .logo{font-family:"Comfortaa",sans-serif;font-weight:700;letter-spacing:-.045em;font-size:28px;color:var(--accent-deep);margin-bottom:14px}
  h1{font-size:19px;font-weight:800;margin-bottom:10px}
  p{font-size:14.5px;color:var(--ink-soft);line-height:1.7}
  .btn{display:block;margin-top:20px;padding:15px;border-radius:14px;background:var(--accent-deep);color:#fff;font-size:17px;font-weight:800;text-decoration:none}
  .cust{display:block;margin-top:10px;font-size:13.5px;color:var(--accent-deep)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">bebeknow</div>
    <h1>이 화면은 더 이상 쓰지 않아요</h1>
    <p>구매 접수는 <b>부스 화면</b>에서 해주세요.<br>잠시 후 자동으로 이동합니다.</p>
    <a class="btn" href="../booth/">부스 화면(맥북)으로 가기</a>
    <a class="cust" href="../booth/customer.html">고객 화면(아이패드) 열기</a>
  </div>
<script>setTimeout(function(){ location.replace("../booth/"); }, 4000);</script>
</body>
</html>
