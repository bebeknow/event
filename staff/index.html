<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>베베노 스태프 · 현장구매 기록</title>
<style>
  :root{
    --bg:#faf6f1;--card:#fff;--ink:#4a3f36;--ink-soft:#8a7c70;--line:#e9dfd5;
    --accent:#c9a086;--accent-deep:#b08464;--accent-tint:#f6ece3;--ok:#7ba05b;--err:#c46a5a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;padding:18px 16px 48px;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
  .wrap{width:100%;max-width:460px}
  h1{font-size:18px;font-weight:800;margin:4px 0 2px}
  .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 2px 12px rgba(74,63,54,.06)}
  label.t{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
  input[type=text],input[type=tel],input[type=password],input[type=number]{
    width:100%;padding:14px;font-size:18px;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;background:#fdfbf8;outline:none;font-family:inherit}
  input:focus{border-color:var(--accent);background:#fff}
  .big{font-size:26px;letter-spacing:.2em;text-align:center;font-weight:800}
  .row{display:flex;gap:8px}
  .row > *{flex:1}
  .btn{width:100%;padding:16px;font-size:16px;font-weight:800;color:#fff;background:var(--accent-deep);border:none;border-radius:14px;cursor:pointer;font-family:inherit;margin-top:6px}
  .btn.sec{background:#fff;color:var(--accent-deep);border:1.5px solid var(--accent)}
  .btn:disabled{opacity:.5}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{position:relative}
  .chip input{position:absolute;opacity:0;inset:0}
  .chip span{display:inline-block;padding:12px 16px;font-size:15px;font-weight:700;border-radius:12px;border:1.5px solid var(--line);background:#fdfbf8;color:var(--ink-soft)}
  .chip input:checked + span{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
  .chip.pink input:checked + span{background:#e8788f;border-color:#e8788f}
  .chip.orange input:checked + span{background:#ef8b3a;border-color:#ef8b3a}
  .chip.green input:checked + span{background:#5fa36a;border-color:#5fa36a}
  .match{display:block;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fdfbf8;margin-top:8px;font-family:inherit;font-size:15px;cursor:pointer}
  .match b{font-size:16px}
  .match small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px}
  .match.sel{border-color:var(--accent-deep);background:var(--accent-tint)}
  .field{margin-bottom:16px}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
  .msg{display:none;margin-top:10px;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.5;font-weight:600}
  .msg.err{display:block;background:#faeae6;color:var(--err)}
  .msg.ok{display:block;background:#e8f3df;color:#3f6b2a}
  .stat{display:flex;gap:8px;margin-bottom:12px}
  .stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:20px;font-weight:800}
  .stat span{font-size:11px;color:var(--ink-soft)}
  .tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--accent-tint);color:var(--accent-deep);margin-left:6px;vertical-align:middle}
  .tag.no{background:#faeae6;color:var(--err)}
  [hidden]{display:none!important}
  footer{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:20px}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== 로그인 ===== -->
  <div id="login">
    <h1>베베노 스태프</h1>
    <p class="sub">현장구매 기록 · 비밀번호는 시트 "집계" 탭 B2</p>
    <div class="card">
      <label class="t" for="pin">비밀번호</label>
      <input type="password" id="pin" class="big" inputmode="numeric" maxlength="6" placeholder="••••">
      <button class="btn" id="loginBtn">들어가기</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <!-- ===== 기록 ===== -->
  <div id="app" hidden>
    <h1>현장구매 기록</h1>
    <p class="sub">구매자가 완료 화면을 보여주면 → 뒷자리 4자리 → 제품·색상 → 기록</p>

    <div class="stat">
      <div><b id="stToday">-</b><span>오늘 구매</span></div>
      <div><b id="stPink">-</b><span>핑크 캐럿헤드</span></div>
      <div><b id="stOrange">-</b><span>오렌지</span></div>
      <div><b id="stGreen">-</b><span>그린</span></div>
    </div>

    <div class="card">
      <div class="field">
        <label class="t" for="last4">전화번호 뒷자리 4자리</label>
        <div class="row">
          <input type="tel" id="last4" class="big" inputmode="numeric" maxlength="4" placeholder="0000">
          <button class="btn sec" id="findBtn" style="flex:0 0 96px;margin-top:0">찾기</button>
        </div>
        <div id="matches"></div>
        <button class="btn sec" id="manualBtn" style="margin-top:10px" hidden>참여자 목록에 없어요 → 직접 입력</button>
      </div>

      <div id="manual" hidden>
        <div class="field">
          <label class="t" for="mName">이름</label>
          <input type="text" id="mName" placeholder="이름">
        </div>
        <div class="field">
          <label class="t" for="mPhone">휴대전화번호</label>
          <input type="tel" id="mPhone" inputmode="numeric" placeholder="010-0000-0000">
        </div>
      </div>

      <div id="who" class="field" hidden>
        <label class="t">구매자</label>
        <div style="font-size:16px"><b id="whoName"></b> <span id="whoPhone" style="color:var(--ink-soft)"></span><span id="whoTag" class="tag"></span></div>
      </div>

      <div class="field">
        <label class="t">제품</label>
        <div class="chips" id="products">
          <label class="chip"><input type="radio" name="product" value="콧물흡입기" checked><span>콧물흡입기</span></label>
          <label class="chip"><input type="radio" name="product" value="아기비데"><span>아기비데</span></label>
          <label class="chip"><input type="radio" name="product" value="실리콘약병"><span>실리콘약병</span></label>
          <label class="chip"><input type="radio" name="product" value="기타"><span>기타</span></label>
        </div>
      </div>
      <div class="field" id="colorField">
        <label class="t">색상 <small style="font-weight:400;color:var(--ink-soft)">(캐럿헤드도 같은 색으로)</small></label>
        <div class="chips">
          <label class="chip pink"><input type="radio" name="color" value="핑크"><span>핑크</span></label>
          <label class="chip orange"><input type="radio" name="color" value="오렌지"><span>오렌지</span></label>
          <label class="chip green"><input type="radio" name="color" value="그린"><span>그린</span></label>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label class="t" for="qty">수량</label>
          <input type="number" id="qty" value="1" min="1" max="9" inputmode="numeric">
        </div>
        <div class="field" style="flex:2">
          <label class="t" for="memo">메모 <small style="font-weight:400;color:var(--ink-soft)">(선택)</small></label>
          <input type="text" id="memo" placeholder="예: 그린 품절로 핑크 지급">
        </div>
      </div>
      <button class="btn" id="saveBtn">기록하기</button>
      <div class="msg" id="msg"></div>
    </div>

    <button class="btn sec" id="logoutBtn">나가기</button>
    <footer>bebeknow staff · <span id="ver">v2026.10.13-1</span></footer>
  </div>

</div>

<script>
var GAS_URL = "https://script.google.com/macros/s/AKfycbwOrp74H1BYqzJ-8Wv7jv4q5qJ8K0qfA1z6YpHIRz-LsfTCHWrP8SoGe_8QYl51Q_zOew/exec";
var PIN_KEY = "bebeknow_staff_pin";
var pin = "";
var buyer = null;        // {name, phone}
var manualMode = false;

function $(id){ return document.getElementById(id); }
function msg(el, t, cls){ el.className = "msg " + cls; el.textContent = t; if(!t) el.className = "msg"; }
function digits(v){ return String(v||"").replace(/\D/g,""); }
function fmtPhone(v){ var d = digits(v).slice(0,11); if(d.length>7) return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7); if(d.length>3) return d.slice(0,3)+"-"+d.slice(3); return d; }
function getJSON(url){ return fetch(url, {redirect:"follow"}).then(function(r){ return r.json(); }); }
function postJSON(body){ return fetch(GAS_URL, {method:"POST", body: JSON.stringify(body), redirect:"follow"}).then(function(r){ return r.json(); }); }

/* ---------- 로그인 ---------- */
function enter(p){
  pin = p;
  try{ sessionStorage.setItem(PIN_KEY, p); }catch(e){}
  $("login").hidden = true; $("app").hidden = false;
  refreshStats();
  setTimeout(function(){ $("last4").focus(); }, 50);
}
$("loginBtn").addEventListener("click", function(){
  var p = $("pin").value.trim();
  if(!p) return msg($("loginMsg"), "비밀번호를 입력해주세요.", "err");
  this.disabled = true; msg($("loginMsg"), "확인 중…", "ok");
  getJSON(GAS_URL + "?staff=today&pin=" + encodeURIComponent(p)).then(function(res){
    $("loginBtn").disabled = false;
    if(res.status === "unauth") return msg($("loginMsg"), "비밀번호가 맞지 않아요. 시트 '집계' 탭 B2를 확인해주세요.", "err");
    if(res.status !== "ok") return msg($("loginMsg"), "연결에 문제가 있어요. 잠시 후 다시 시도해주세요.", "err");
    msg($("loginMsg"), "", ""); enter(p); applyStats(res);
  }).catch(function(){ $("loginBtn").disabled = false; msg($("loginMsg"), "네트워크 연결을 확인해주세요.", "err"); });
});
$("pin").addEventListener("keydown", function(e){ if(e.key === "Enter") $("loginBtn").click(); });
$("logoutBtn").addEventListener("click", function(){ try{ sessionStorage.removeItem(PIN_KEY); }catch(e){} location.reload(); });

/* ---------- 오늘 통계 ---------- */
function applyStats(res){
  $("stToday").textContent = res.today;
  $("stPink").textContent = res.colors["핑크"] || 0;
  $("stOrange").textContent = res.colors["오렌지"] || 0;
  $("stGreen").textContent = res.colors["그린"] || 0;
}
function refreshStats(){
  getJSON(GAS_URL + "?staff=today&pin=" + encodeURIComponent(pin)).then(function(res){ if(res.status === "ok") applyStats(res); }).catch(function(){});
}

/* ---------- 참여자 찾기 ---------- */
function setBuyer(b, participant){
  buyer = b;
  $("who").hidden = !b;
  if(b){
    $("whoName").textContent = b.name;
    $("whoPhone").textContent = b.phone;
    var tag = $("whoTag");
    tag.textContent = participant ? "미션 참여자" : "참여 기록 없음";
    tag.className = "tag" + (participant ? "" : " no");
  }
}
function renderMatches(list){
  var box = $("matches"); box.innerHTML = "";
  list.forEach(function(m){
    var b = document.createElement("button");
    b.type = "button"; b.className = "match";
    b.innerHTML = "<b>" + m.name + "</b> " + m.masked + "<small>" + m.at + " 참여</small>";
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(box.children, function(c){ c.classList.remove("sel"); });
      b.classList.add("sel");
      manualMode = false; $("manual").hidden = true;
      setBuyer({ name: m.name, phone: m.phone }, true);
    });
    box.appendChild(b);
  });
  if(list.length === 1) box.firstChild.click();
}
function find(){
  var l4 = digits($("last4").value).slice(-4);
  msg($("msg"), "", "");
  setBuyer(null); $("matches").innerHTML = ""; $("manualBtn").hidden = true;
  if(l4.length !== 4) return msg($("msg"), "뒷자리 4자리를 입력해주세요.", "err");
  $("findBtn").disabled = true; $("findBtn").textContent = "…";
  getJSON(GAS_URL + "?staff=lookup&pin=" + encodeURIComponent(pin) + "&last4=" + l4).then(function(res){
    $("findBtn").disabled = false; $("findBtn").textContent = "찾기";
    if(res.status === "unauth"){ try{ sessionStorage.removeItem(PIN_KEY); }catch(e){} return location.reload(); }
    if(res.status !== "ok") return msg($("msg"), "조회에 실패했어요. 다시 시도해주세요.", "err");
    if(!res.matches.length){
      msg($("msg"), "뒷자리 " + l4 + " 참여자가 없어요. 미션을 안 한 분이면 직접 입력으로 기록할 수 있어요.", "err");
      $("manualBtn").hidden = false;
      return;
    }
    renderMatches(res.matches);
    $("manualBtn").hidden = false;
  }).catch(function(){ $("findBtn").disabled = false; $("findBtn").textContent = "찾기"; msg($("msg"), "네트워크 연결을 확인해주세요.", "err"); });
}
$("findBtn").addEventListener("click", find);
$("last4").addEventListener("input", function(){ this.value = digits(this.value).slice(0,4); if(this.value.length === 4) find(); });
$("last4").addEventListener("keydown", function(e){ if(e.key === "Enter") find(); });
$("manualBtn").addEventListener("click", function(){
  manualMode = true; $("manual").hidden = false; setBuyer(null);
  Array.prototype.forEach.call($("matches").children, function(c){ c.classList.remove("sel"); });
  $("mName").focus();
});
$("mPhone").addEventListener("input", function(){ this.value = fmtPhone(this.value); });

/* 제품에 따라 색상 칸 표시 */
Array.prototype.forEach.call(document.querySelectorAll('input[name="product"]'), function(r){
  r.addEventListener("change", function(){ $("colorField").hidden = !(r.value === "콧물흡입기" || r.value === "아기비데"); });
});

/* ---------- 기록 ---------- */
$("saveBtn").addEventListener("click", function(){
  msg($("msg"), "", "");
  var name, phone;
  if(manualMode){
    name = $("mName").value.trim(); phone = $("mPhone").value.trim();
    if(!name) return msg($("msg"), "이름을 입력해주세요.", "err");
    if(digits(phone).length < 10) return msg($("msg"), "휴대전화번호를 확인해주세요.", "err");
  }else{
    if(!buyer) return msg($("msg"), "먼저 뒷자리 4자리로 구매자를 찾아 선택해주세요.", "err");
    name = buyer.name; phone = buyer.phone;
  }
  var product = (document.querySelector('input[name="product"]:checked') || {}).value;
  var colorEl = document.querySelector('input[name="color"]:checked');
  var color = colorEl ? colorEl.value : "";
  var needColor = product === "콧물흡입기" || product === "아기비데";
  if(!product) return msg($("msg"), "제품을 선택해주세요.", "err");
  if(needColor && !color) return msg($("msg"), "색상을 선택해주세요.", "err");
  var qty = Math.max(1, parseInt($("qty").value, 10) || 1);
  var btn = $("saveBtn"); btn.disabled = true; btn.textContent = "기록 중…";
  postJSON({ action:"buy", pin: pin, name: name, phone: phone, product: product, color: needColor ? color : "", qty: qty, memo: $("memo").value.trim() })
    .then(function(res){
      btn.disabled = false; btn.textContent = "기록하기";
      if(res.status === "unauth"){ try{ sessionStorage.removeItem(PIN_KEY); }catch(e){} return location.reload(); }
      if(res.status !== "ok") return msg($("msg"), "저장에 실패했어요. 다시 시도해주세요.", "err");
      msg($("msg"), "✅ 기록됨 · " + name + " · " + product + (color ? " " + color : "") + " ×" + qty + (product === "콧물흡입기" ? " → 캐럿헤드(" + color + ") 증정" : ""), "ok");
      /* 다음 입력 준비 */
      buyer = null; manualMode = false; $("manual").hidden = true; $("who").hidden = true;
      $("matches").innerHTML = ""; $("manualBtn").hidden = true;
      $("last4").value = ""; $("mName").value = ""; $("mPhone").value = ""; $("memo").value = ""; $("qty").value = 1;
      if(colorEl) colorEl.checked = false;
      refreshStats();
      setTimeout(function(){ $("last4").focus(); }, 50);
    })
    .catch(function(){ btn.disabled = false; btn.textContent = "기록하기"; msg($("msg"), "네트워크 연결을 확인해주세요.", "err"); });
});

/* ---------- 자동 로그인 (같은 브라우저 세션) ---------- */
(function(){
  var saved = ""; try{ saved = sessionStorage.getItem(PIN_KEY) || ""; }catch(e){}
  if(saved){ $("pin").value = saved; $("loginBtn").click(); }
})();
</script>
</body>
</html>
